services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-local_knowledge_rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # 5433 на хосте: 5432 часто занят локально установленным PostgreSQL
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag}"]
      interval: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data


  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
    environment: &app_env
      POSTGRES_HOST: postgres
      # Внутри сети Compose обращаемся к штатному порту контейнера,
      # а не к проброшенному на хост.
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-local_knowledge_rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # Ollama остаётся на хосте: в контейнере на macOS нет доступа к
      # Metal, а на Linux — к GPU без отдельной настройки.
      #
      # Имя переменной намеренно отличается от OLLAMA_URL: в .env лежит
      # адрес для локального запуска (localhost), и внутри контейнера он
      # указывал бы на сам контейнер.
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY обязателен для запуска}
    volumes:
      # Общий том с воркером: файл сохраняет API, а читает его воркер.
      - documents:/app/storage/documents
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment: *app_env
    volumes:
      - documents:/app/storage/documents
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["observability"]
    depends_on:
      - api
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.3.1
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      # Дашборд поднимается автопровижионингом, логин нужен только человеку;
      # наружу этот порт выставлять не следует.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  documents:
  prometheus_data:
  grafana_data:
