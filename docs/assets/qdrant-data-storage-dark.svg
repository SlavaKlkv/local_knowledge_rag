    <text class="mono" x="971" y="279" text-anchor="middle" font-size="29">knowledge_chunks</text>
  </g>
  <path class="edge pink" d="M592.5 518 L615.2 417.7" marker-end="url(#ap)"/>

  <!-- ========== СТРУКТУРА ОДНОЙ ТОЧКИ / ЧАНКА ========== -->
  <rect class="soft point-section-accent" x="816" y="34" width="442" height="546" rx="14" fill="#1c0f19" stroke-width="2.5"/>
  <rect x="917" y="21" width="240" height="26" rx="13" fill="#c43d7d"/>
  <text class="lbl cap badge-label" x="1037" y="39" text-anchor="middle">СТРУКТУРА ТОЧКИ QDRANT</text>

  <g transform="translate(0 -17.5)">
  <rect x="832" y="78" width="410" height="100" rx="10" fill="#383842" stroke="#cfd6e6" stroke-width="1.6"/>
  <text class="lbl h2" x="1037" y="107" text-anchor="middle">1. ID</text>
  <rect x="850" y="126" width="374" height="36" rx="6" fill="#292930" stroke="#cfd6e6" stroke-width="1.4"/>
  <text class="mono s" x="1037" y="149" text-anchor="middle">UUIDv5(document_id / version / chunk_index)</text>
  </g>

  <g transform="translate(0 -5.5)">
  <rect x="832" y="178" width="410" height="168" rx="10" fill="#24170c" stroke="#af5800" stroke-width="1.6"/>
  <text class="lbl h2" x="1037" y="210" text-anchor="middle">2. Векторы</text>
  <g transform="translate(0 4)">
  <rect x="848" y="228" width="180" height="62" rx="7" fill="#3b3b08" stroke="#afaf00" stroke-width="1.4"/>
  <text class="mono s" x="938" y="254" text-anchor="middle">dense</text>
  <text class="lbl s" x="938" y="275" text-anchor="middle">768 чисел · cosine</text>
  <rect x="1040" y="228" width="186" height="62" rx="7" fill="#3b0a0a" stroke="#af0000" stroke-width="1.4"/>
  <text class="mono s" x="1133" y="252" text-anchor="middle">sparse</text>
  <text class="mono s" x="1133" y="276" text-anchor="middle">indices[] + values[]</text>
  <path d="M998 302 L1026 314 M1076 302 L1048 314" fill="none" stroke="#af5800" stroke-width="2" stroke-linecap="round"/>
  <circle cx="1037" cy="323" r="4" fill="#af5800"/>
  </g>
  </g>

  <g transform="translate(0 10.5)">
  <rect x="832" y="342" width="410" height="214" rx="10" fill="#0b231c" stroke="#2fb88a" stroke-width="1.6"/>
  <text class="lbl h2" x="1037" y="366.5" text-anchor="middle" dominant-baseline="middle">3. Payload</text>
  <text class="lbl s dim" x="1212" y="365.5" text-anchor="end" dominant-baseline="middle">метаданные</text>
  <rect x="850" y="387" width="374" height="118" rx="6" fill="#0c1d19" stroke="#2fb88a" stroke-width="1.4"/>
  <path d="M958 401 H1094 M1003 419 H1094 M904 455 H1094" fill="none" stroke="#9aa3b8" stroke-width="1" stroke-linecap="round"/>
  <text class="mono s" x="862" y="405">document_id</text>
  <text class="lbl s dim" x="1212" y="405" text-anchor="end">+ индекс payload</text>
  <text class="mono s" x="862" y="423">knowledge_base_id</text>
  <text class="lbl s dim" x="1212" y="423" text-anchor="end">+ индекс payload</text>
  <text class="mono s" x="862" y="441">document_name · chunk_index</text>
  <text class="mono s" x="862" y="459">text</text>
  <text class="lbl s dim" x="1212" y="459" text-anchor="end">источник цитаты</text>
  <text class="mono s" x="862" y="477">page · section</text>
  <text class="mono s" x="862" y="495">version · embedding_version</text>
  <rect x="850" y="513" width="374" height="30" rx="6" fill="none" stroke="#2fb88a" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text class="lbl s" x="1037" y="533" text-anchor="middle">коллекция и индексы создаются при первой индексации</text>
  </g>

  <!-- переиндексация: относится к точкам Qdrant, поэтому стоит рядом с ними -->
  <rect class="soft" x="816" y="600" width="442" height="121" rx="10" fill="#1b1429" stroke="#9c78d3" stroke-width="2"/>
  <text class="lbl h2" x="1037" y="626" text-anchor="middle">Новая версия документа</text>
  <path d="M937 647.5 H1137" fill="none" stroke="#e8eaf2" stroke-width="1.4" stroke-opacity=".5" stroke-linecap="round"/>
  <circle cx="927" cy="647.5" r="10" fill="#1b1429" stroke="#e8eaf2" stroke-width="1.4"/>
  <text class="lbl xs" x="927" y="651.5" text-anchor="middle">1</text>
  <circle cx="1147" cy="647.5" r="10" fill="#1b1429" stroke="#e8eaf2" stroke-width="1.4"/>
  <text class="lbl xs" x="1147" y="651.5" text-anchor="middle">2</text>
  <text class="lbl" x="927" y="675" text-anchor="middle" font-size="12.5">upsert всех точек</text>
  <text class="lbl" x="927" y="688" text-anchor="middle" font-size="12.5">версии N+1</text>
  <text class="lbl" x="1147" y="675" text-anchor="middle" font-size="12.5">затем удаление точек</text>
  <text class="lbl" x="1147" y="688" text-anchor="middle" font-size="12.5">версии N</text>
  <text class="lbl dim" x="1037" y="709" text-anchor="middle" font-size="12.5">обратный порядок оставил бы документ без индекса при сбое</text>

</svg>
