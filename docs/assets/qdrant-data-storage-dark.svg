<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 748" width="1280" height="748" role="img" aria-labelledby="t d">
  <title id="t">Как проект хранит данные</title>
  <desc id="d">Документ парсится фоновым воркером Celery и режется на чанки по 400 слов с overlap 60; для каждого чанка считаются dense- и sparse-вектор, и чанк становится одной точкой коллекции knowledge_chunks с payload; метаданные, версии, права и диалоги хранятся в PostgreSQL; запрос переписывается по истории диалога, идёт параллельно в dense и sparse поиск с фильтром по базе знаний, результаты объединяются через RRF, переранжируются cross-encoder и собираются в контекст для локальной LLM.</desc>
  <defs>
    <style>
      .bg   { fill: #08080d; }
      .card { fill: #101018; }
      .lbl  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #e8eaf2; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #e8eaf2; }
      .dim  { fill: #9aa3b8; }
      .h1   { font-size: 21px; font-weight: 700; }
      .h2   { font-size: 16px; font-weight: 700; }
      .cap  { font-size: 12px; font-weight: 700; letter-spacing: 1.3px; }
      .badge-label { fill: #e2e3e8; }
      .point-section-accent { stroke: #c43d7d; }
      .t    { font-size: 14px; }
      .s    { font-size: 12.5px; }
      .xs   { font-size: 11.5px; }
      .edge { fill: none; stroke: #cfd6e6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .pink { stroke: #ec4899; } .cyan { stroke: #22d3ee; } .yellow { stroke: #eab308; }
      .violet { stroke: #9c78d3; } .blue { stroke: #60a5fa; } .green { stroke: #2fb88a; }
      .blue-pink-mix { stroke: #9c78d3; }
      .box  { fill: #101018; stroke-width: 2; }
      .fill-blue { fill: #0d1d33; } .fill-pink { fill: #2a0b1b; }
      .fill-cyan { fill: #08262e; } .fill-yellow { fill: #292106; }
      .fill-violet { fill: #1b1429; } .fill-green { fill: #0b231c; }
      .fill-blue-pink-mix { fill: #1b1429; }
      .fill-process { fill: #121722; }
      .soft { filter: url(#shadow); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cfd6e6"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ec4899"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c78d3"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9c78d3"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eab308"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.32"/></filter>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
    <radialGradient id="qdrant-glow" cx="50%" cy="48%" r="50%">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".12"/>
      <stop offset=".55" stop-color="#ec4899" stop-opacity=".07"/>
      <stop offset=".7" stop-color="#ec4899" stop-opacity=".02"/>
      <stop offset=".78" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="database-qdrant-glow">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".17"/>
      <stop offset=".7" stop-color="#ec4899" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="canvas-clip"><rect x="0" y="0" width="1280" height="748" rx="14"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1280" height="748" rx="14" fill="url(#bg-gradient)"/>

  <!-- ========== ИНДЕКСАЦИЯ ========== -->
  <text class="lbl cap dim" x="220" y="38" text-anchor="middle">ОТ ДОКУМЕНТА К ТОЧКЕ</text>

  <rect class="box blue fill-blue soft" x="40" y="52" width="360" height="76" rx="10"/>
  <g transform="translate(62,90)">
    <rect x="0" y="-16" width="26" height="32" rx="4" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <path d="M6 -8 H20 M6 -1 H20 M6 6 H15" stroke="#60a5fa" stroke-width="2" fill="none"/>
  </g>
  <text class="lbl h2" x="106" y="84">Документ</text>
  <text class="lbl s dim" x="106" y="107">PDF · DOCX · HTML · MD · TXT</text>

  <path class="edge" d="M220 128 V 152" marker-end="url(#a)"/>
  <rect class="box blue fill-process" x="40" y="160" width="360" height="52" rx="10"/>
  <text class="lbl t" x="220" y="191" text-anchor="middle">Парсинг и нормализация</text>

  <path class="edge" d="M220 212 V 236" marker-end="url(#a)"/>
  <rect class="box blue fill-process" x="40" y="244" width="360" height="52" rx="10"/>
  <text class="lbl t" x="220" y="275" text-anchor="middle">Чанкинг: 400 слов / overlap 60</text>

  <path class="edge" d="M88 296 V342" marker-end="url(#a)"/>
  <path class="edge" d="M220 296 V342" marker-end="url(#a)"/>
  <path class="edge" d="M352 296 V342" marker-end="url(#a)"/>
  <rect class="box blue fill-process" x="40" y="350" width="96" height="44" rx="8"/>
  <text class="lbl s" x="88" y="377" text-anchor="middle">Чанк 0</text>
  <rect class="box blue fill-process" x="172" y="350" width="96" height="44" rx="8"/>
  <text class="lbl s" x="220" y="377" text-anchor="middle">Чанк 1</text>
  <text class="lbl h2 dim" x="290" y="379" text-anchor="middle">…</text>
  <rect class="box blue fill-process" x="304" y="350" width="96" height="44" rx="8"/>
  <text class="lbl s" x="352" y="377" text-anchor="middle">Чанк N</text>

  <!-- Прямая связь между углами синей и фиолетовой рамок. -->
  <path class="edge blue" d="M398.4 393.7 L496.9 511.5" marker-end="url(#ab)"/>
  <rect class="soft fill-blue-pink-mix blue-pink-mix" x="504" y="520" width="176" height="44" rx="8" stroke-width="2"/>
  <text class="lbl t" x="592" y="547" text-anchor="middle"><tspan>1 чанк</tspan><tspan dx="10">→</tspan><tspan dx="10">1 точка</tspan></text>
  <path class="fill-blue soft" d="M64 488 H368 V699 C368 712 300 721 216 721 C132 721 64 712 64 699 Z" stroke="#60a5fa" stroke-width="2"/>
  <ellipse cx="216" cy="488" rx="152" ry="29" fill="#14283d" stroke="#60a5fa" stroke-width="2"/>
  <path d="M64 558.333 C64 571.333 132 580.333 216 580.333 C300 580.333 368 571.333 368 558.333" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-opacity=".62"/>
  <path d="M64 628.667 C64 641.667 132 650.667 216 650.667 C300 650.667 368 641.667 368 628.667" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-opacity=".62"/>
  <path class="edge blue" d="M40 90 H22 V540 H53" marker-end="url(#ab)"/>
  <text class="lbl h2" x="216" y="494" text-anchor="middle">PostgreSQL</text>
  <text class="lbl t" x="216" y="542" text-anchor="middle">документы · версии</text>
  <text class="lbl t" x="216" y="566" text-anchor="middle">права · диалоги</text>
  <text class="lbl t" x="216" y="608" text-anchor="middle">задачи индексации</text>
  <text class="lbl t" x="216" y="632" text-anchor="middle">пользователи</text>
  <path id="postgres-history-line" d="M82 671 Q216 687 350 671" fill="none"/>
  <path id="postgres-qdrant-line" d="M82 692 Q216 710 350 692" fill="none"/>
  <text class="lbl t dim" text-anchor="middle"><textPath href="#postgres-history-line" startOffset="50%">история версий сохраняется здесь;</textPath></text>
  <text class="lbl t dim" text-anchor="middle"><textPath href="#postgres-qdrant-line" startOffset="50%">в Qdrant старые точки удаляются</textPath></text>

  <!-- ========== QDRANT: ОБЛАКО ИЗ database-shapes-dark.svg ========== -->
  <text class="lbl cap dim" x="608" y="44" text-anchor="middle">ВЕКТОРНАЯ БАЗА</text>
  <g transform="translate(-52 126) scale(.68)">
