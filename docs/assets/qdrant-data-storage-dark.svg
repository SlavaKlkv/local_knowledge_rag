      <circle cx="984" cy="91" r="7"/><circle cx="1017" cy="113" r="7"/>
      <circle cx="1051" cy="91" r="7"/><circle cx="1081" cy="116" r="7"/>
      <circle cx="1037" cy="143" r="7"/>

      <circle cx="1160" cy="190" r="7"/><circle cx="1226" cy="235" r="7"/>
      <circle cx="1165" cy="286" r="7"/><circle cx="1196" cy="310" r="7"/>

      <circle cx="822" cy="355" r="7"/><circle cx="856" cy="377" r="7"/>
      <circle cx="891" cy="356" r="7"/><circle cx="923" cy="383" r="7"/>
      <circle cx="956" cy="361" r="7"/><circle cx="990" cy="389" r="7"/>
      <circle cx="1024" cy="365" r="7"/><circle cx="1058" cy="392" r="7"/>
    </g>
    <g fill="#ec4899" stroke="#ffd0e5" stroke-width="1.5">
