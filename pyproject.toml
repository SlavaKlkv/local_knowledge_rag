[project]
name = "local-knowledge-rag"
version = "0.1.0"
description = "Fully local RAG platform for internal document search with citations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.12",
    "httpx>=0.28",
    "python-multipart>=0.0.20",
    "pypdf>=5.1",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "psutil>=7.2.2",
    "celery>=5.6.3",
    "redis>=8.1.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
# Cross-encoder тянет torch (~2.5 ГБ). Extra остаётся опциональным для
# установки из исходников, но официальный Docker-образ включает его: там
# качественная выдача должна работать сразу, без ручной пересборки.
reranking = [
    "sentence-transformers>=6.0.1",
    # Фиксируем ветку, опубликованную и для macOS, и в CPU-only индексе Linux.
    "torch==2.9.1",
]

# Linux-контейнер работает на CPU: обычный PyPI wheel torch подтягивает CUDA
# runtime, который здесь не используется и сильно раздувает сборку.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # Depends(...) в значениях по умолчанию — идиома FastAPI
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Миграции генерируются автоматически, длину строк в них не правим вручную.
"alembic/versions/*.py" = ["E501"]
